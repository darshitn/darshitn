<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 295" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cardBgLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <pattern id="dotPatternLight" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#CBD5E1" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
    
    @keyframes blinkSlowLight {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .blink-green-l { animation: blinkSlowLight 2s infinite ease-in-out; }
    .blink-cyan-l { animation: blinkSlowLight 2.5s infinite ease-in-out; }
    .blink-amber-l { animation: blinkSlowLight 1.8s infinite ease-in-out; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="916" height="291" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
  <rect x="3" y="3" width="914" height="289" rx="7" fill="url(#dotPatternLight)" opacity="0.7" />

  <!-- Section Topbar -->
  <path d="M 2 38 L 918 38" stroke="#E2E8F0" stroke-width="1" />
  <rect x="2" y="2" width="916" height="36" rx="8" fill="#F1F5F9" />
  <text x="24" y="23" fill="#0284C7" class="mono" font-size="11" font-weight="700" letter-spacing="1.5">02 // ACTIVE SYSTEM MODULES</text>
  <text x="260" y="23" fill="#CBD5E1" class="mono" font-size="11">|</text>
  <text x="275" y="23" fill="#64748B" class="mono" font-size="10.5">SLOTS ALLOCATED: <tspan fill="#059669" font-weight="700">3 / 3 ACTIVE</tspan></text>
  <text x="895" y="23" text-anchor="end" fill="#64748B" class="mono" font-size="10">AUTOSYNC: ONLINE</text>

  <!-- ==================== MODULE 01: RAZORPAY RECOVERY ==================== -->
  <g transform="translate(18, 52)">
    <rect x="0" y="0" width="280" height="225" rx="6" fill="url(#cardBgLight)" stroke="#CBD5E1" stroke-width="1" />
    <!-- Top accent strip -->
    <path d="M 0 4 Q 0 0 4 0 L 276 0 Q 280 0 280 4 L 280 28 L 0 28 Z" fill="#F0F9FF" />
    <path d="M 0 28 L 280 28" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Module ID & Status -->
    <text x="12" y="18" fill="#0284C7" class="mono" font-size="9.5" font-weight="700" letter-spacing="1">MOD_01 // FINTECH</text>
    <circle class="blink-green-l" cx="264" cy="14" r="3.5" fill="#059669" />

    <!-- Project Title -->
    <text x="12" y="52" fill="#0F172A" class="sans" font-size="15.5" font-weight="700">Razorpay Recovery</text>
    <text x="12" y="68" fill="#0284C7" class="mono" font-size="10" font-weight="600" letter-spacing="0.5">Deterministic Policy Engine</text>

    <!-- Description -->
    <text x="12" y="94" fill="#475569" class="sans" font-size="11.5">
      <tspan x="12" dy="0">Revenue recovery platform with</tspan>
      <tspan x="12" dy="16">deterministic policy routing, webhooks</tspan>
      <tspan x="12" dy="16">and AI-generated failure explanations.</tspan>
    </text>

    <!-- Stack Section -->
    <rect x="10" y="152" width="260" height="34" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8" />
    <text x="18" y="166" fill="#64748B" class="mono" font-size="8.5" letter-spacing="0.8">CORE RUNTIME</text>
    <text x="18" y="179" fill="#0F172A" class="mono" font-size="10" font-weight="600">FastAPI • Razorpay • LLM</text>

    <!-- Footer metadata -->
    <path d="M 0 196 L 280 196" stroke="#E2E8F0" stroke-width="1" />
    <text x="12" y="213" fill="#059669" class="mono" font-size="9.5" font-weight="700">● LIVE RUNTIME</text>
    <text x="268" y="213" text-anchor="end" fill="#0284C7" class="mono" font-size="9.5" font-weight="600">VIEW REPO ▶</text>
  </g>

  <!-- ==================== MODULE 02: LAN CHESS ==================== -->
  <g transform="translate(320, 52)">
    <rect x="0" y="0" width="280" height="225" rx="6" fill="url(#cardBgLight)" stroke="#CBD5E1" stroke-width="1" />
    <!-- Top accent strip -->
    <path d="M 0 4 Q 0 0 4 0 L 276 0 Q 280 0 280 4 L 280 28 L 0 28 Z" fill="#F0F9FF" />
    <path d="M 0 28 L 280 28" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Module ID & Status -->
    <text x="12" y="18" fill="#0284C7" class="mono" font-size="9.5" font-weight="700" letter-spacing="1">MOD_02 // NETWORK</text>
    <circle class="blink-cyan-l" cx="264" cy="14" r="3.5" fill="#0284C7" />

    <!-- Project Title -->
    <text x="12" y="52" fill="#0F172A" class="sans" font-size="15.5" font-weight="700">LAN Chess Platform</text>
    <text x="12" y="68" fill="#0284C7" class="mono" font-size="10" font-weight="600" letter-spacing="0.5">Multiplayer Protocol Engine</text>

    <!-- Description -->
    <text x="12" y="94" fill="#475569" class="sans" font-size="11.5">
      <tspan x="12" dy="0">Multiplayer chess system with LAN</tspan>
      <tspan x="12" dy="16">network gameplay, custom themes,</tspan>
      <tspan x="12" dy="16">move analysis &amp; Stockfish integration.</tspan>
    </text>

    <!-- Stack Section -->
    <rect x="10" y="152" width="260" height="34" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8" />
    <text x="18" y="166" fill="#64748B" class="mono" font-size="8.5" letter-spacing="0.8">CORE RUNTIME</text>
    <text x="18" y="179" fill="#0F172A" class="mono" font-size="10" font-weight="600">Sockets • Stockfish • C++ / Py</text>

    <!-- Footer metadata -->
    <path d="M 0 196 L 280 196" stroke="#E2E8F0" stroke-width="1" />
    <text x="12" y="213" fill="#0284C7" class="mono" font-size="9.5" font-weight="700">● MULTIPLAYER SYNC</text>
    <text x="268" y="213" text-anchor="end" fill="#0284C7" class="mono" font-size="9.5" font-weight="600">VIEW REPO ▶</text>
  </g>

  <!-- ==================== MODULE 03: V.E.G.A. AI DASHBOARD ==================== -->
  <g transform="translate(622, 52)">
    <rect x="0" y="0" width="280" height="225" rx="6" fill="url(#cardBgLight)" stroke="#CBD5E1" stroke-width="1" />
    <!-- Top accent strip -->
    <path d="M 0 4 Q 0 0 4 0 L 276 0 Q 280 0 280 4 L 280 28 L 0 28 Z" fill="#FFFBEB" />
    <path d="M 0 28 L 280 28" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Module ID & Status -->
    <text x="12" y="18" fill="#D97706" class="mono" font-size="9.5" font-weight="700" letter-spacing="1">MOD_03 // ASSISTANT</text>
    <circle class="blink-amber-l" cx="264" cy="14" r="3.5" fill="#D97706" />

    <!-- Project Title -->
    <text x="12" y="52" fill="#0F172A" class="sans" font-size="15.5" font-weight="700">V.E.G.A. AI Dashboard</text>
    <text x="12" y="68" fill="#D97706" class="mono" font-size="10" font-weight="600" letter-spacing="0.5">Desktop AI &amp; System Monitor</text>

    <!-- Description -->
    <text x="12" y="94" fill="#475569" class="sans" font-size="11.5">
      <tspan x="12" dy="0">Local-first desktop AI assistant and</tspan>
      <tspan x="12" dy="16">system monitor with global hotkeys,</tspan>
      <tspan x="12" dy="16">FastAPI backend &amp; local AI models.</tspan>
    </text>

    <!-- Stack Section -->
    <rect x="10" y="152" width="260" height="34" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8" />
    <text x="18" y="166" fill="#64748B" class="mono" font-size="8.5" letter-spacing="0.8">CORE RUNTIME</text>
    <text x="18" y="179" fill="#0F172A" class="mono" font-size="10" font-weight="600">FastAPI • React • Electron • Local AI</text>

    <!-- Footer metadata -->
    <path d="M 0 196 L 280 196" stroke="#E2E8F0" stroke-width="1" />
    <text x="12" y="213" fill="#D97706" class="mono" font-size="9.5" font-weight="700">● LOCAL RUNTIME</text>
    <text x="268" y="213" text-anchor="end" fill="#0284C7" class="mono" font-size="9.5" font-weight="600">VIEW REPO ▶</text>
  </g>

</svg>
