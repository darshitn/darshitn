<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 76" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="footerBgDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080D14" />
      <stop offset="50%" stop-color="#0E1624" />
      <stop offset="100%" stop-color="#080D14" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="916" height="72" rx="6" fill="url(#footerBgDark)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Corner Brackets -->
  <path d="M 8 14 L 8 8 L 14 8" stroke="#00F0FF" stroke-width="1.2" fill="none" opacity="0.6" />
  <path d="M 912 14 L 912 8 L 906 8" stroke="#00F0FF" stroke-width="1.2" fill="none" opacity="0.6" />
  <path d="M 8 62 L 8 68 L 14 68" stroke="#00F0FF" stroke-width="1.2" fill="none" opacity="0.6" />
  <path d="M 912 62 L 912 68 L 906 68" stroke="#00F0FF" stroke-width="1.2" fill="none" opacity="0.6" />

  <!-- Left: System Code -->
  <g transform="translate(24, 42)">
    <circle cx="0" cy="-4" r="3" fill="#00E599" />
    <text x="12" y="0" fill="#64748B" class="mono" font-size="10.5" letter-spacing="1">SYS_STATUS // <tspan fill="#00E599">SHIPPING MODE</tspan></text>
  </g>

  <!-- Center: Philosophy / Directive -->
  <text x="460" y="42" text-anchor="middle" fill="#F8FAFC" class="mono" font-size="13" font-weight="800" letter-spacing="4">
    BUILD <tspan fill="#00F0FF">•</tspan> TEST <tspan fill="#00E599">•</tspan> SHIP
  </text>

  <!-- Right: Identity Sign-off -->
  <text x="896" y="42" text-anchor="end" fill="#94A3B8" class="mono" font-size="10.5" letter-spacing="0.5">
    N DARSHIT <tspan fill="#334155">//</tspan> <tspan fill="#38BDF8">TERMINAL END</tspan>
  </text>
</svg>
