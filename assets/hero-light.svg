<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentCyanLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <linearGradient id="accentGreenLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridPatternLight" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#CBD5E1" stroke-width="0.7" stroke-opacity="0.5" />
      <circle cx="24" cy="24" r="0.8" fill="#0284C7" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
    
    @keyframes pulseLedLight {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.92); }
    }

    @keyframes radarSpinLight {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes subtlePingLight {
      0% { r: 3; opacity: 0.8; }
      100% { r: 9; opacity: 0; }
    }

    .status-led-light {
      transform-origin: 32px 33px;
      animation: pulseLedLight 2.2s ease-in-out infinite;
    }

    .radar-sweep-light {
      transform-origin: 840px 75px;
      animation: radarSpinLight 10s linear infinite;
    }

    .radar-ping-light {
      animation: subtlePingLight 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
  </style>

  <!-- Container Box with Technical Border -->
  <rect x="2" y="2" width="916" height="326" rx="8" fill="url(#bgGradLight)" stroke="#CBD5E1" stroke-width="1.2" />
  
  <!-- Subtle Grid Fill -->
  <rect x="3" y="3" width="914" height="324" rx="7" fill="url(#gridPatternLight)" />

  <!-- Top Header Bar / Telemetry Strip -->
  <path d="M 2 46 L 918 46" stroke="#E2E8F0" stroke-width="1" />
  <rect x="2" y="2" width="916" height="44" rx="8" fill="#F1F5F9" fill-opacity="0.95" />
  <path d="M 2 46 L 918 46" stroke="#0284C7" stroke-width="1" stroke-opacity="0.25" />

  <!-- Corner Brackets (Control Room aesthetic) -->
  <path d="M 12 18 L 12 10 L 20 10" stroke="#0284C7" stroke-width="1.5" fill="none" />
  <path d="M 908 18 L 908 10 L 900 10" stroke="#0284C7" stroke-width="1.5" fill="none" />
  <path d="M 12 312 L 12 320 L 20 320" stroke="#0284C7" stroke-width="1.5" fill="none" />
  <path d="M 908 312 L 908 320 L 900 320" stroke="#0284C7" stroke-width="1.5" fill="none" />

  <!-- Header Items: Status Pill & Station ID -->
  <g transform="translate(10, 0)">
    <!-- Status LED -->
    <circle class="radar-ping-light" cx="32" cy="24" r="5" fill="none" stroke="#059669" stroke-width="1.5" />
    <circle class="status-led-light" cx="32" cy="24" r="3.5" fill="#059669" />
    
    <text x="46" y="28" fill="#059669" class="mono" font-size="11" font-weight="700" letter-spacing="1">CONSOLE: ACTIVE</text>
    <text x="175" y="28" fill="#CBD5E1" class="mono" font-size="11">|</text>
    <text x="190" y="28" fill="#475569" class="mono" font-size="11" letter-spacing="0.5">NODE // <tspan fill="#0F172A" font-weight="600">ND-STATION-02</tspan></text>
    <text x="350" y="28" fill="#CBD5E1" class="mono" font-size="11">|</text>
    <text x="365" y="28" fill="#64748B" class="mono" font-size="11" letter-spacing="0.5">SYS_TIME: <tspan fill="#334155">UTC+05:30</tspan></text>
    <text x="510" y="28" fill="#CBD5E1" class="mono" font-size="11">|</text>
    <text x="525" y="28" fill="#0284C7" class="mono" font-size="11" letter-spacing="0.8">TARGET: <tspan fill="#0F172A" font-weight="600">BUILD &amp; SHIP</tspan></text>
  </g>

  <!-- Technical Telemetry Reticle in Top Right -->
  <g transform="translate(20, -5)">
    <circle cx="820" cy="80" r="34" stroke="#CBD5E1" stroke-width="1" fill="none" stroke-dasharray="2 3" />
    <circle cx="820" cy="80" r="24" stroke="#0284C7" stroke-width="0.8" fill="none" stroke-opacity="0.4" />
    <circle cx="820" cy="80" r="14" stroke="#059669" stroke-width="0.6" fill="none" stroke-opacity="0.5" />
    <line x1="820" y1="42" x2="820" y2="118" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="2 2" />
    <line x1="782" y1="80" x2="858" y2="80" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="2 2" />
    
    <!-- Rotating radar sweep line -->
    <g class="radar-sweep-light" transform-origin="820 80">
      <line x1="820" y1="80" x2="844" y2="56" stroke="url(#accentCyanLight)" stroke-width="1.5" stroke-linecap="round" />
    </g>
    <text x="820" y="126" text-anchor="middle" fill="#64748B" class="mono" font-size="8.5" letter-spacing="1.2">RADAR // MONITOR</text>
  </g>

  <!-- Section Badge -->
  <g transform="translate(42, 74)">
    <rect x="0" y="0" width="138" height="22" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-opacity="0.5" stroke-width="1" />
    <text x="10" y="15" fill="#0369A1" class="mono" font-size="10.5" font-weight="700" letter-spacing="1.5">01 // IDENTITY</text>
  </g>

  <!-- Primary Name Display -->
  <text x="42" y="142" fill="#0F172A" class="sans" font-size="44" font-weight="800" letter-spacing="-0.5">
    N DARSHIT
  </text>

  <!-- Positioning Line with Gradient Accent -->
  <g transform="translate(42, 160)">
    <rect x="0" y="0" width="4" height="26" fill="url(#accentGreenLight)" rx="2" />
    <text x="14" y="19" fill="#0284C7" class="mono" font-size="17" font-weight="700" letter-spacing="1.2">
      AI / BACKEND / SOFTWARE BUILDER
    </text>
  </g>

  <!-- Positioning Statement -->
  <text x="42" y="218" fill="#475569" class="sans" font-size="15" font-weight="500">
    I build practical systems, experiment with AI, and ship software that actually runs.
  </text>

  <!-- Divider Line -->
  <line x1="42" y1="242" x2="878" y2="242" stroke="#E2E8F0" stroke-width="1" />

  <!-- Bottom Control Rack / Metadata Chips -->
  <!-- Chip 1: Role -->
  <g transform="translate(42, 260)">
    <rect x="0" y="0" width="200" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <text x="14" y="16" fill="#64748B" class="mono" font-size="9" letter-spacing="1">STATION ROLE</text>
    <text x="14" y="32" fill="#0F172A" class="mono" font-size="11.5" font-weight="700">2nd-Year B.Tech CSE</text>
  </g>

  <!-- Chip 2: Focus -->
  <g transform="translate(254, 260)">
    <rect x="0" y="0" width="220" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <text x="14" y="16" fill="#64748B" class="mono" font-size="9" letter-spacing="1">PRIMARY ARCHITECTURE</text>
    <text x="14" y="32" fill="#0369A1" class="mono" font-size="11.5" font-weight="700">AI Systems &amp; Backends</text>
  </g>

  <!-- Chip 3: Execution Mode -->
  <g transform="translate(486, 260)">
    <rect x="0" y="0" width="180" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <text x="14" y="16" fill="#64748B" class="mono" font-size="9" letter-spacing="1">OPERATING MODE</text>
    <text x="14" y="32" fill="#059669" class="mono" font-size="11.5" font-weight="700">Build • Ship • Iterate</text>
  </g>

  <!-- Chip 4: Telemetry Link Terminal -->
  <g transform="translate(678, 260)">
    <rect x="0" y="0" width="200" height="42" rx="4" fill="#F0F9FF" stroke="#0284C7" stroke-opacity="0.4" stroke-width="1" />
    <text x="14" y="16" fill="#0369A1" class="mono" font-size="9" letter-spacing="1">COMM PROTOCOL</text>
    <text x="14" y="32" fill="#0F172A" class="mono" font-size="11.5" font-weight="700">DISPATCH READY ▶</text>
  </g>

</svg>
