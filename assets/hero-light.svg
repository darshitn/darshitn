<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="heroLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F6F8FA" />
    </linearGradient>

    <!-- Subtle Minimalist Grid in Corner -->
    <pattern id="minimalGridLight" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E1E4E8" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <style>
    .sans-display {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
    }
    .mono-meta {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
  </style>

  <!-- Card Frame -->
  <rect x="1" y="1" width="898" height="238" rx="8" fill="url(#heroLightBg)" stroke="#D0D7DE" stroke-width="1" />
  
  <!-- Subtle Grid Accent on the Right -->
  <rect x="620" y="2" width="276" height="236" rx="7" fill="url(#minimalGridLight)" />

  <!-- Top Metadata Bar -->
  <g transform="translate(36, 34)">
    <!-- Small Status Indicator -->
    <circle cx="0" cy="0" r="3.5" fill="#1A7F37" />
    <text x="12" y="3.5" fill="#57606A" class="mono-meta" font-size="11" font-weight="500">
      2nd-year B.Tech CSE  •  Bengaluru, India  •  Building &amp; Shipping
    </text>
  </g>

  <!-- Name -->
  <text x="36" y="98" fill="#1F2328" class="sans-display" font-size="38" font-weight="700" letter-spacing="-0.5">
    N Darshit
  </text>

  <!-- Role Subtitle -->
  <text x="36" y="128" fill="#0969DA" class="sans-display" font-size="15" font-weight="600" letter-spacing="0.5">
    AI / Backend / Software Builder
  </text>

  <!-- Positioning Statement -->
  <text x="36" y="164" fill="#57606A" class="sans-display" font-size="14.5" font-weight="400">
    I build practical systems, experiment with AI, and ship software that actually runs.
  </text>

  <!-- Bottom Divider Line -->
  <line x1="36" y1="190" x2="864" y2="190" stroke="#E1E4E8" stroke-width="1" />

  <!-- Bottom Tags -->
  <g transform="translate(36, 212)">
    <text x="0" y="0" fill="#57606A" class="sans-display" font-size="12">
      Core: <tspan fill="#1F2328" font-weight="600">FastAPI</tspan>  •  <tspan fill="#1F2328" font-weight="600">Python</tspan>  •  <tspan fill="#1F2328" font-weight="600">React</tspan>  •  <tspan fill="#1F2328" font-weight="600">TypeScript</tspan>  •  <tspan fill="#1F2328" font-weight="600">PostgreSQL</tspan>
    </text>
    <text x="828" y="0" text-anchor="end" fill="#1A7F37" class="mono-meta" font-size="11">
      Open for collaborations ↗
    </text>
  </g>
</svg>
